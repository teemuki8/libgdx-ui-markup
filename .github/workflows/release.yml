name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, stage, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - name: Check out signed tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted annotated semantic-version tag
        shell: bash
        env:
          TRUSTED_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_SIGNING_PUBLIC_KEY }}
          TRUSTED_RELEASE_FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$TRUSTED_RELEASE_PUBLIC_KEY"
          expected="$(printf '%s' "$TRUSTED_RELEASE_FINGERPRINT" \
            | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]]; then
            echo 'Trusted release fingerprint is missing or malformed' >&2
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          key_file="$GNUPGHOME/release-signing-key.asc"
          printf '%s\n' "$TRUSTED_RELEASE_PUBLIC_KEY" > "$key_file"
          chmod 600 "$key_file"
          gpg --batch --quiet --import "$key_file"
          primary_count="$(gpg --batch --with-colons --list-keys \
            | awk -F: '$1 == "pub" { count++ } END { print count + 0 }')"
          if [[ "$primary_count" != 1 ]]; then
            echo 'Trusted key material must contain exactly one primary key' >&2
            exit 1
          fi
          actual="$(gpg --batch --with-colons --fingerprint \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Imported release key fingerprint does not match repository policy' >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag is not semantic: $tag" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          if [[ "$(git cat-file -t "refs/tags/$tag")" != tag ]]; then
            echo 'Release ref must be an annotated tag' >&2
            exit 1
          fi
          git tag --verify "$tag"
          if [[ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]]; then
            echo 'Signed tag does not identify the workflow commit' >&2
            exit 1
          fi
      - name: Install JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install Linux virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Run release gate and create signed Central bundle
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          xvfb-run -a ./gradlew -Prelease=true -PreleaseVersion="$version" \
            clean check javadoc centralBundle --warning-mode=fail
      - name: Upload user-managed Central staging deployment
        id: staging
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="build/distributions/central-bundle-$version.zip"
          test -s "$bundle"
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          chmod 600 "$curl_config"
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" \
            "$MAVEN_CENTRAL_PASSWORD" | base64 --wrap=0)"
          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$curl_config"
          unset token
          deployment_id="$(curl --config "$curl_config" \
            --fail-with-body --silent --show-error --request POST \
            --form "bundle=@$bundle;type=application/octet-stream" \
            'https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED')"
          if [[ ! "$deployment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo 'Central returned an invalid deployment identifier' >&2
            exit 1
          fi
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Require successful Central staging validation
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.staging.outputs.deployment-id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          chmod 600 "$curl_config"
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" \
            "$MAVEN_CENTRAL_PASSWORD" | base64 --wrap=0)"
          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$curl_config"
          unset token
          for attempt in $(seq 1 90); do
            response="$(curl --config "$curl_config" \
              --fail-with-body --silent --show-error --request POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            state="$(jq --exit-status --raw-output '.deploymentState' <<<"$response")"
            case "$state" in
              VALIDATED) exit 0 ;;
              FAILED) jq . <<<"$response" >&2; exit 1 ;;
              PENDING|VALIDATING) sleep 10 ;;
              *) echo "Unexpected Central staging state: $state" >&2; exit 1 ;;
            esac
          done
          echo 'Central staging validation timed out' >&2
          exit 1
      - name: Publish validated deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.staging.outputs.deployment-id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          chmod 600 "$curl_config"
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" \
            "$MAVEN_CENTRAL_PASSWORD" | base64 --wrap=0)"
          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$curl_config"
          unset token
          curl --config "$curl_config" --fail-with-body --silent --show-error \
            --request POST \
            "https://central.sonatype.com/api/v1/publisher/deployment/$DEPLOYMENT_ID"
          for attempt in $(seq 1 90); do
            response="$(curl --config "$curl_config" \
              --fail-with-body --silent --show-error --request POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            state="$(jq --exit-status --raw-output '.deploymentState' <<<"$response")"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq . <<<"$response" >&2; exit 1 ;;
              VALIDATED|PUBLISHING) sleep 10 ;;
              *) echo "Unexpected Central publication state: $state" >&2; exit 1 ;;
            esac
          done
          echo 'Central publication timed out' >&2
          exit 1
      - name: Retain failed release evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-release-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/central-staging/**
